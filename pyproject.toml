[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsnow"
version = "0.1.1"
description = "qSNOW (Simulated Noise Orchestration Workflow) - orchestrate multiple logicals with complex rule-based noise models across a grid/chip of qubits."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "stim",
    "sinter",
    "plotly",
    "matplotlib>=3.8",  # Legend.set_loc, used to pin the stacked CDF legends
    "nbformat",
    "shapely",
    "scipy",
    "pymatching",
    "tqdm",
]

[project.optional-dependencies]
dev = ["ipykernel", "ipywidgets", "ruff"]
test = ["pytest", "pytest-cov", "kaleido"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "tests/*"
]

[tool.tox]
requires = ["tox>=4.19"]
env_list = ["py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
deps = ["pytest", "kaleido"]
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]

[tool.tox.gh.python]
"3.14" = ["py314"]
"3.13" = ["py313"]
"3.12" = ["py312"]
"3.11" = ["py311"]
